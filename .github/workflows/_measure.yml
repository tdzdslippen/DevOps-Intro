name: measure
# TEMPORARY — Task 2.4 baseline timing. Deleted after measurement.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/_measure.yml"
permissions:
  contents: read
jobs:
  measure:
    name: measure
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: app/go.mod # cache ON, single Go version
      - run: go vet ./...
      - run: go test -race -count=1 ./...
